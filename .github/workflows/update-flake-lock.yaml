name: update-flake-lock

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    # This task only calculates the inputs again and builds no package.
    # Thus it uses a Linux runner, and a macOS runner is not necessary.  The
    # push at the end of this task starts the macOS build in build.yaml.
    runs-on: ubuntu-latest
    steps:
      # ssh-key sets the remote through SSH with the deploy key.  Thus the
      # push, and GitHub identifies it with the key, not with GITHUB_TOKEN.
      # Thus the push DOES start build.yaml on master.  A deploy key with write access is
      # necessary for this step.  The repo secret FLAKE_UPDATE_DEPLOY_KEY
      # keeps the private key.
      - uses: actions/checkout@v4
        with:
          ssh-key: '${{ secrets.FLAKE_UPDATE_DEPLOY_KEY }}'

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake.lock
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # This command makes a commit only if the lock file changed.
          nix flake update --commit-lock-file

      - name: Push
        run: git push origin HEAD:master

name: update-flake-lock

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}
concurrency: update-flake-lock

jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086

      - run: nix flake update

      - name: Open or update the lock PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet HEAD -- flake.lock; then exit 0; fi

          branch=automation/flake-lock
          ref="refs/heads/$branch"
          gh auth setup-git
          expected=$(git ls-remote --refs origin "$ref" | cut -f1)
          bot_email='41898282+github-actions[bot]@users.noreply.github.com'
          git -c user.name='github-actions[bot]' -c user.email="$bot_email" \
            commit -m 'Update flake.lock' -- flake.lock
          git push --force-with-lease="$ref:$expected" origin "HEAD:$ref"

          open=$(gh pr list --state open --base master --head "$branch" \
            --json isCrossRepository --jq 'any(.[]; .isCrossRepository | not)')
          if [[ $open == false ]]; then
            gh pr create --base master --head "$branch" \
              --title 'Update flake.lock' \
              --body 'Review the input revisions and approve the build.'
          fi
